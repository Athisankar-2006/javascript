
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variables</title>
 </head>
 <body>
    

    <script>
        //var
        var n=5;   //The var keyword is used to declare a variable.
        console.log(n);

        var n=20;
        console.log(n);  // reassigning is allowed
    
    //let

    let n=10;  //cannot be re-declared in the same scope.
    n=20; //value can be updated
    let n=15; // but can not redeclare
    console.log(n)
    
    

    //const

    //The const keyword declares variables that cannot be reassigned. It's block-scoped as well
    const n=100;
    //n=200 this will threw an error
    console.log(n);
    
    
    </script>
 </body>
 </html>
